name: Update Playgama Games JSON

on:
  schedule:
    # Otomatis update setiap 6 jam sekali
    - cron: '0 */6 * * *'
  workflow_dispatch: # Tombol untuk menjalankan manual kapan saja

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download latest games JSON
        env:
          PLAYGAMA_URL: ${{ secrets.PLAYGAMA_URL }}
        run: |
          curl -L "$PLAYGAMA_URL" -o games.json

      - name: Commit and push if there are changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --staged --quiet || (git commit -m "Auto-update games.json from Playgama" && git push)
          
