name: Update Games Catalog

on:
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis setiap 6 jam sekali
  workflow_dispatch: # Bisa dijalankan secara manual dari tab Actions di GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install node-fetch

      - name: Run Fetch Script
        run: node fetch-games.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add games.json
          git commit -m "Auto-update games.json database" || echo "Tidak ada perubahan data"
          git push
          
